summary: |
  NIBBLE-KO is the percussion half of NIBBLE (uglifruit/WorkshopNibble),
  expanded into a dedicated twelve-voice drum machine: every voice
  independently synthesised or sample-based, chosen and uploaded from a
  browser WebUI.<br><br>

  Patch one output of the FOUR VOLTAGES module into CV In 1. The card learns
  which voltage each button combination produces, the same ten-level
  detector and SHIFT technique as NIBBLE's Percussion half: hold one button
  as a bank select, tap another to play it repeatedly - twelve ordered
  gestures from four buttons and six pairs.<br><br>

  THIS CARD IS NOT YET PLAYABLE. It is a scaffold: the level detector, event
  looper, and synth voice engine are ported from NIBBLE and pass their
  verification models, but there is no main.cpp, no sample playback, and no
  working WebUI yet. See the repository's CLAUDE.md and docs/LESSONS.md for
  what exists and what is still designed.

panel:
  inputs:
    - id: CVIn1
      name: Four Voltages
      type: cv
      description: Patch one output of the Four Voltages module here. The card learns which voltage each button combination produces, so it works at any position of the Four Voltages knob - re-learn whenever you move it. If two combinations cannot be told apart the card says so during calibration rather than guessing.
    - id: CVIn2
      name: Unused
      type: cv
      description: Not used in this version.
    - id: PulseIn1
      name: ClkIn
      type: pulse
      description: An external clock at one pulse per beat. Overrides the tempo knob for as long as pulses keep arriving and hands the tempo back a few seconds after they stop.
    - id: PulseIn2
      name: Unused
      type: pulse
      description: Not used in this version.
  outputs:
    - id: CVOut1
      name: Bass
      type: cv
      description: A four-note bassline played by the single buttons, which make no drum sound and so have a spare output - A is the root, B a tone below, C the fifth, D the octave.
    - id: CVOut2
      name: Unused
      type: cv
      description: Not used in this version.
    - id: AudioOut1
      name: Drums
      type: audio
      description: The mono drum bus, after the DJ filter. Audio Out 2 carries the same bus, not a stereo partner - patch either socket and you get the whole kit.
    - id: AudioOut2
      name: Drums
      type: audio
      description: The same mono drum bus as Audio Out 1.
    - id: PulseOut1
      name: Gate
      type: pulse
      description: Fires on every drum hit, live or looped.
    - id: PulseOut2
      name: Click
      type: pulse
      description: Fires once per beat.

controls:
  switch:
    up:
      name: Record
      description: Record and overdub into the loop; the loop keeps running, and because it stores events rather than audio, overdubbing never degrades what is already there.
    middle:
      name: Play
      description: The loop plays, and you can play along without recording.
    down:
      name: Calibrate
      description: Calibration starts automatically at power-on, since the learned levels are never saved. Hold for two seconds to start another at any time, or to abort one in progress.
    tap:
      name: Retrigger
      description: Re-strikes the bass note the held single button is playing.
  knobs:
    -
      main:
        name: DJ Filter
        description: Low-pass to the left, high-pass to the right, with a generous bypass at centre. Its movements are recorded into the loop.
      x:
        name: Tempo
        description: 40 to 240 BPM, ignored while an external clock is running on Pulse In 1.
      y:
        name: Kit character
        description: Reshapes the whole kit at once when a voice is struck. What this does to a sample-backed voice is undecided - see repository docs.
  leds:
    -
      display: list
      items:
        - id: LED0-3
          name: Buttons A B / C D
          description: Laid out in the same 2x2 as the Four Voltages buttons - shows which combination is currently held, flashes on each hit, and during calibration shows which combination to press next.
        - id: LED4
          name: Beat
          description: Pulses on the beat. During calibration marks the four single-button steps.
        - id: LED5
          name: Record
          description: Lit while recording. During calibration marks the six two-button steps.

host:
  notes: |
    NOT YET BUILDABLE. See the repository's CLAUDE.md for current status.
