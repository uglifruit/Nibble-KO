summary: |
  NIBBLE-KO is the percussion half of NIBBLE (uglifruit/WorkshopNibble),
  expanded into a dedicated twelve-voice drum machine: every voice
  independently synthesised or sample-based, chosen and uploaded from a
  browser WebUI.<br><br>

  Patch one output of the FOUR VOLTAGES module into CV In 1. The card learns
  which voltage each button combination produces, the same ten-level
  detector and SHIFT technique as NIBBLE's Percussion half: hold one button
  as a bank select, tap another to play it repeatedly - twelve ordered
  gestures from four buttons and six pairs.<br><br>

  CALIBRATION IS THE WHOLE GAME. Use output 1 of Four Voltages with its knob
  near twelve o'clock, and give the card ten well-separated voltages. Levels
  that sit close together do not fail cleanly - a pad plays the wrong drum,
  fires twice or does nothing, differently each time. The card blinks LEDs 4
  and 5 when two captures are too close; move the knob and run it again
  rather than playing around it.<br><br>

  The momentary switch is a MODE SELECTOR rather than a trigger. Hold it and
  press a button to choose - drums, mute groups, or twelve performance
  effects - then Middle plays that mode and Up records it. Because the mode
  latches, everything is recorded through one mechanism.<br><br>

  THE EFFECTS are four banks of three, the shift picking the family: filters,
  destruction (crush, decimate, wavefold), rhythmic (stutter, flam, gate) and
  transport (reverse, tape-stop, silence). Up to four layer at once, in
  series. The transport bank means different things to different voices - a
  sample plays backwards where a synthesised voice runs its ENVELOPE
  backwards, a swell instead of a decay - so one press gives backwards kick
  and hats over swelling toms at the same time. Each shift records two lanes,
  the effect and its own parameter curve, so a sweep can be drawn once and
  effects punched in and out over the top of it.<br><br>

  IN DEVELOPMENT. Drums, the four-bar looper, mute groups, the effects and
  sample playback all work on hardware. Calibration is not yet saved to
  flash, so the card recalibrates at every power-up; the browser sample
  manager is not written; and one mode slot is still unassigned. See the
  repository's CLAUDE.md for what exists and what is still designed.

panel:
  inputs:
    - id: CVIn1
      name: Four Voltages
      type: cv
      description: "Patch one output of the Four Voltages module here - output 1 with its knob near twelve o'clock is the reliable setting. The card learns which voltage each button combination produces, so it works at any knob position; re-learn whenever you move it. WELL-SEPARATED VOLTAGES MATTER MORE THAN ANYTHING ELSE: the knob moves all four outputs at once, and towards either extreme several combinations collapse onto nearly the same voltage. Two levels sitting close together do not fail cleanly - a pad plays the wrong drum, fires twice or does nothing, differently each time, because a few millivolts of drift moves the reading across the boundary. The card flags it (LEDs 4 and 5 blink during calibration) rather than guessing, and the fix is to move the Four Voltages knob and calibrate again."
    - id: CVIn2
      name: Unused
      type: cv
      description: Not used in this version.
    - id: PulseIn1
      name: ClkIn
      type: pulse
      description: An external clock at one pulse per beat. Overrides the tempo knob for as long as pulses keep arriving and hands the tempo back a few seconds after they stop.
    - id: PulseIn2
      name: Unused
      type: pulse
      description: Not used in this version.
  outputs:
    - id: CVOut1
      name: Bass
      type: cv
      description: A four-note bassline played by the single buttons, which make no drum sound and so have a spare output - A is the root, B a tone below, C the fifth, D the octave.
    - id: CVOut2
      name: Unused
      type: cv
      description: Not used in this version.
    - id: AudioOut1
      name: Drums
      type: audio
      description: The mono drum bus, after the DJ filter. Audio Out 2 carries the same bus, not a stereo partner - patch either socket and you get the whole kit.
    - id: AudioOut2
      name: Drums
      type: audio
      description: The same mono drum bus as Audio Out 1.
    - id: PulseOut1
      name: Gate
      type: pulse
      description: Fires on every drum hit, live or looped.
    - id: PulseOut2
      name: Click
      type: pulse
      description: Fires once per beat.

controls:
  switch:
    up:
      name: Record
      description: Play the current mode AND record it. Drum hits, mute toggles, effects and knob movements are all captured the same way. The loop stores events rather than audio, so overdubbing never degrades what is already there.
    middle:
      name: Play
      description: Play the current mode without recording.
    down:
      name: Mode select
      description: "Hold DOWN and press a button to choose a mode; the choice lands when you RELEASE, and then LATCHES, so Down and Up never need to be held at once. A: drums. B: mute groups. C: twelve performance effects. D: unassigned. With a PAIR held it fires a one-shot instead - A+B undo, C+D play/stop, A+C the browser setup, A+D quantise (the last two are not implemented yet). Commit-on-release exists because Four Voltages holds its last voltage: the CV may already be sitting on the button you want, so a press-driven select would never fire."
    tap:
      name: Capture (during calibration)
      description: While calibrating, tap to capture the combination you are holding. Outside calibration a tap is just a short mode-select gesture and does nothing on its own.
  knobs:
    -
      main:
        name: DJ Filter / FX depth
        description: "In DRUMS and MUTE it is a DJ filter - low-pass to the left, high-pass to the right, generous bypass at centre. In FX mode it becomes the held effect's depth instead, and the filter latches where it was, picking up again only when the knob is turned back through that value so leaving the mode never jumps it. Movements are recorded into the loop; in FX mode each shift has its own parameter curve, so holding a shift alone and turning Main draws that lane's automation."
      x:
        name: Tempo
        description: 40 to 240 BPM, ignored while an external clock is running on Pulse In 1.
      y:
        name: Kit character
        description: Reshapes the whole kit at once when a voice is struck - anticlockwise lower and longer, clockwise higher and shorter. On a synthesised voice that is pitch and decay; on a sampled one it is playback rate, which couples the two the way tape does. Applied at the moment of striking, so sweeping it never warps a sound already ringing.
  leds:
    -
      display: list
      items:
        - id: LED0-3
          name: Buttons A B / C D
          description: Laid out in the same 2x2 as the Four Voltages buttons - shows which combination is currently held, flashes on each hit, and during calibration shows which combination to press next.
        - id: LED4
          name: Beat
          description: Pulses on the beat. During calibration marks the four single-button steps.
        - id: LED5
          name: Record
          description: Lit while recording. During calibration marks the six two-button steps.

host:
